<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <!-- On relie le fichier CSS à la page HTML -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- .main = Toute la page, avec l'image de fond -->
    <div class="main">

        <!-- .navbar = Barre du haut : logo + menu -->
        <div class="navbar">
            <!-- Le logo -->
            <!-- <img src="assets/icons/logo.jpeg" class="logo"> -->
            <a href=""></a>
            <!-- Le menu de navigation -->
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SKILLS</a></li>
                <li><a href="#">MY WORKS</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </div>

        <!-- .info = Texte à gauche : présentation -->
        <div class="info">
            <h3>Hi, I'm <span>Renelle.</span>Nguessimi</h3>
            <!-- span = pour colorer juste un mot en orange -->
            <h1><span>W</span>EB <span>D</span>ESIGNER</h1>
            <h3>Web designer and developer from Brazzaville,Congo.
                I create <br> websites to do businesses do better online.</h3>
            <!-- Bouton Hire Me -->
            <a href="#">Hire Me</a>
        </div>

        <!-- .image = ma photo  à droite -->
        <div class="image">
            <img src="assets/img/femme.jpeg" class="girl">
        </div>

        <!-- .icons = Les icônes Facebook, Instagram, Twitter en bas -->
        <div class="icons">
            <a href="#"><img src="assets/icons/facebook.jpeg" alt=""></a>
            <a href="#"><img src="assets/icons/instagram-50.png" alt=""></a>
            <a href="#"><img src="assets/icons/twiter.jpeg" alt=""></a>
        </div>

    </div>

</html>
